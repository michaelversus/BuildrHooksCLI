# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: BuildrHooksCLI Unit Tests

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4
    - uses: SwiftyLab/setup-swift@latest
    - name: Run tests with coverage
      run: swift test --enable-code-coverage
    - name: Generate coverage report (lcov)
      run: |
        set -euo pipefail
        COVERAGE_JSON="$(swift test --show-codecov-path)"
        test -s "${COVERAGE_JSON}"
        jq --arg source_root "${GITHUB_WORKSPACE}/Sources/" -r '
          .data[].files[]
          | select(.filename | startswith($source_root))
          | .filename as $file
          | ([.segments[] | select(.[3] == true) | {line: .[0], count: .[2]}]
             | sort_by(.line) | group_by(.line)) as $lines
          | "SF:\($file)",
            ($lines[] | "DA:\(.[0].line),\([.[].count] | max)"),
            "end_of_record"
        ' "${COVERAGE_JSON}" > info.lcov
        test -s info.lcov
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: michaelversus/BuildrHooksCLI
        files: info.lcov
        fail_ci_if_error: true
        verbose: true
