name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare version commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # A rerun finds the commit made by its original run, even if main moved.
          RELEASE_COMMIT=$(git log origin/main --format=%H \
            --grep="^Release-Run-ID: ${GITHUB_RUN_ID}$" -1)
          if [[ -n "$RELEASE_COMMIT" ]]; then
            NEW_VERSION=$(git show "$RELEASE_COMMIT:VERSION")
            MODE=resume
          else
            CURRENT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
            if [[ ! "$CURRENT" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Latest published release '$CURRENT' is not a bare semantic version."
              exit 1
            fi

            MAIN_VERSION=$(cat VERSION)
            if [[ "$MAIN_VERSION" != "$CURRENT" ]]; then
              echo "::error::VERSION is $MAIN_VERSION but the latest published release is $CURRENT. Rerun the incomplete release."
              exit 1
            fi

            IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
              minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              *)
                echo "::error::Unsupported version bump '$BUMP'."
                exit 1
                ;;
            esac

            if git rev-parse -q --verify "refs/tags/${NEW_VERSION}" >/dev/null; then
              echo "::error::Tag $NEW_VERSION already exists. Rerun its original release workflow."
              exit 1
            fi

            printf '%s\n' "$NEW_VERSION" > VERSION
            printf 'let version = "%s"\n' "$NEW_VERSION" > Sources/BuildrHooksCLI/Version.swift
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add VERSION Sources/BuildrHooksCLI/Version.swift
            git commit -m "ci(release): bump version to ${NEW_VERSION}" \
              -m "Release-Run-ID: ${GITHUB_RUN_ID}"
            RELEASE_COMMIT=$(git rev-parse HEAD)
            MODE=new
          fi

          if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version '$NEW_VERSION' is invalid."
            exit 1
          fi
          if [[ "$(git show "$RELEASE_COMMIT:Sources/BuildrHooksCLI/Version.swift")" != "let version = \"$NEW_VERSION\"" ]]; then
            echo "::error::Version.swift disagrees with VERSION at $RELEASE_COMMIT."
            exit 1
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Check out the exact release commit
        env:
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
        run: git switch --detach "$RELEASE_COMMIT"

      - name: Show Swift toolchain
        run: swift --version

      - name: Run release tests
        timeout-minutes: 5
        run: swift test --no-parallel

      - name: Publish version commit, tag, and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          MODE: ${{ steps.version.outputs.mode }}
        run: |
          set -euo pipefail

          if [[ "$MODE" == new ]]; then
            git push origin "${RELEASE_COMMIT}:refs/heads/main"
          fi

          if git rev-parse -q --verify "refs/tags/${VERSION}^{commit}" >/dev/null; then
            TAG_COMMIT=$(git rev-parse "refs/tags/${VERSION}^{commit}")
            if [[ "$TAG_COMMIT" != "$RELEASE_COMMIT" ]]; then
              echo "::error::Tag $VERSION points to $TAG_COMMIT, not $RELEASE_COMMIT."
              exit 1
            fi
          else
            git tag "$VERSION" "$RELEASE_COMMIT"
            git push origin "refs/tags/$VERSION"
          fi

          if gh release view "$VERSION" --json isDraft --jq .isDraft > release-draft.txt; then
            if [[ "$(cat release-draft.txt)" == true ]]; then
              gh release edit "$VERSION" --draft=false
            else
              echo "Release $VERSION is already published."
            fi
          else
            gh release create "$VERSION" --verify-tag \
              --title "$VERSION" --generate-notes
          fi

          git push origin "HEAD:${SYNC_BRANCH}"
          TITLE="Sync develop into main after release ${VERSION}"
          BODY="This pull request syncs the released develop branch into main. Resolve any merge conflicts on this pull request."
          PR_STATE=$(gh pr view "$SYNC_BRANCH" --repo "$GITHUB_REPOSITORY" --json state --jq '.state' 2>/dev/null || true)
          case "$PR_STATE" in
            OPEN)
              gh pr edit "$SYNC_BRANCH" --repo "$GITHUB_REPOSITORY" \
                --title "$TITLE" --body "$BODY"
              ;;
            CLOSED)
              gh pr reopen "$SYNC_BRANCH" --repo "$GITHUB_REPOSITORY"
              ;;
            MERGED)
              echo "Sync pull request for release ${VERSION} is already merged."
              ;;
            *)
              gh pr create --repo "$GITHUB_REPOSITORY" \
                --base main --head "$SYNC_BRANCH" \
                --title "$TITLE" --body "$BODY"
              ;;
          esac
